<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="sheet.css">
</head>
<body>
<button id="add">+</button>
<div id="new-expense">
    <div>
        <label>Name:
            <input type="text" class="name" id="nameNew">
        </label>
        <select class="category" id="categoryNew">
        <option value="Category" selected hidden>Category</option>
        <option value="Food">Food</option>
        <option value="Utility">Utility</option>
        <option value="Misc">Misc</option>
    </select>
    </div>
    <label>Amount:
        <input type="number" class="amount" id="amountNew">
        <label>$</label>
    </label>
    <button id="registerNew">Save expense</button>
</div>
<div id="edit-expense">
    <div>
        <label>Name:
            <input type="text" class="name" id="name">
        </label>
        <select class="category" id="category">
        <option value="" selected hidden>Category</option>
        <option value="Food">Food</option>
        <option value="Utility">Utility</option>
        <option value="Misc">Misc</option>
    </select>
    </div>
    <label>Amount:
        <input type="number" class="amount" id="amount">
        <label>$</label>
    </label>
    <button id="register">Save expense</button>
</div>

<div id="expenses-tab">
    <table>
        <thead style="border-bottom: black 2px solid;">
        <tr>
            <th>Expense</th>
            <th>Category</th>
            <th>Amount</th>
        </tr>
        </thead>
        <tr class="table-spacer"></tr>
        <tbody id="expenses-tab-body"></tbody>
    </table>
</div>

</body>
<script src="app.js"></script>
</html>
